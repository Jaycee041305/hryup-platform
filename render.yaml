databases:
  - name: hryup-db
    databaseName: hryup
    user: hryup_user
    plan: free

services:
  - type: web
    name: hryup-platform
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn hryup.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: hryup.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: '*'
      - key: DATABASE_URL
        fromDatabase:
          name: hryup-db
          property: connectionString
