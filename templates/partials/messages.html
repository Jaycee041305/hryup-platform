{% if messages %}
<div class="toast-container position-fixed top-0 end-0 p-3 mt-5">
    {% for message in messages %}
        <div class="toast align-items-center text-bg-{% if message.tags == 'error' %}danger{% elif message.tags == 'success' %}success{% elif message.tags == 'warning' %}warning{% else %}info{% endif %} border-0 mb-2" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    {% if message.tags == 'error' %}
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    {% elif message.tags == 'success' %}
                        <i class="bi bi-check-circle-fill me-2"></i>
                    {% elif message.tags == 'warning' %}
                        <i class="bi bi-exclamation-circle-fill me-2"></i>
                    {% else %}
                        <i class="bi bi-info-circle-fill me-2"></i>
                    {% endif %}
                    {{ message }}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    {% endfor %}
</div>
{% endif %}
