<div class="empty-state">
    <div class="empty-state-icon">
        <i class="bi {{ icon|default:'bi-inbox' }}"></i>
    </div>
    <h4 class="mb-2">{{ title|default:"No Data Available" }}</h4>
    <p class="text-muted mb-4">{{ description|default:"There is currently no data to display here." }}</p>
    {% if action_url and action_text %}
        <a href="{{ action_url }}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-2"></i>{{ action_text }}
        </a>
    {% endif %}
</div>
