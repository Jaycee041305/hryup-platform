<div class="mb-3">
    {% if field.label %}
    <label for="{{ field.id_for_label }}" class="form-label fw-medium">{{ field.label }} {% if field.field.required %}<span class="text-danger">*</span>{% endif %}</label>
    {% endif %}
    
    {% if field.field.widget.input_type == 'checkbox' %}
        <div class="form-check">
            {{ field }}
            <label class="form-check-label" for="{{ field.id_for_label }}">
                {{ field.help_text|safe }}
            </label>
        </div>
    {% else %}
        {{ field }}
        {% if field.help_text %}
            <div class="form-text text-muted">{{ field.help_text|safe }}</div>
        {% endif %}
    {% endif %}
    
    {% if field.errors %}
        {% for error in field.errors %}
            <div class="invalid-feedback d-block">
                {{ error }}
            </div>
        {% endfor %}
    {% endif %}
</div>
