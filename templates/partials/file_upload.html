<div class="mb-3">
    {% if field.label %}
    <label for="{{ field.id_for_label }}" class="form-label fw-medium">{{ field.label }} {% if field.field.required %}<span class="text-danger">*</span>{% endif %}</label>
    {% endif %}
    
    <div class="input-group">
        {{ field }}
        <label class="input-group-text custom-file-label" for="{{ field.id_for_label }}">Browse</label>
    </div>
    
    {% if field.help_text %}
        <div class="form-text text-muted">{{ field.help_text|safe }}</div>
    {% endif %}
    
    {% if field.errors %}
        {% for error in field.errors %}
            <div class="invalid-feedback d-block">
                {{ error }}
            </div>
        {% endfor %}
    {% endif %}
</div>
