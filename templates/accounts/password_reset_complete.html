{% extends 'base.html' %}

{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="container min-vh-100 d-flex justify-content-center align-items-center py-5">
    <div class="card shadow-lg border-0 text-center" style="width: 100%; max-width: 450px;">
        <div class="card-body p-5">
            <div class="mb-4">
                <i class="bi bi-check-circle-fill text-success" style="font-size: 4rem;"></i>
            </div>
            <h3 class="fw-bold mb-3">Password Reset Complete</h3>
            <p class="text-muted mb-4">Your password has been successfully reset. You may go ahead and log in now.</p>
            
            <div class="mt-4">
                <a href="{% url 'accounts:login' %}" class="btn btn-primary btn-lg w-100">Log In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
