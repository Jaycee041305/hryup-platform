{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="container min-vh-100 d-flex justify-content-center align-items-center py-5">
    <div class="card shadow-lg border-0" style="width: 100%; max-width: 450px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <h3 class="fw-bold mb-2">Reset Password</h3>
                <p class="text-muted">Enter your email address and we'll send you a link to reset your password.</p>
            </div>

            <form method="post">
                {% csrf_token %}
                {% include 'partials/form_field.html' with field=form.email %}
                
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary">Send Reset Link</button>
                </div>
            </form>
            
            <div class="text-center mt-4">
                <a href="{% url 'accounts:login' %}" class="text-decoration-none text-muted"><i class="bi bi-arrow-left me-1"></i> Back to login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
