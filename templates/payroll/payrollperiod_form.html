{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>Create Payroll Period</h2>
    <div class="alert alert-info">
        <strong>Note:</strong> This module is for <em>Data Compilation Only - No Tax Computation</em>.
    </div>
    
    <div class="card">
        <div class="card-body">
            <form method="post" action="{% if request.GET.company %}?company={{ request.GET.company }}{% endif %}">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Save</button>
                <a href="{% url 'payroll:period_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
